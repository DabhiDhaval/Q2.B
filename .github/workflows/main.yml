name: Deploy Static Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        docker build -t ${{ secrets.DOCKER_USERNAME }}/static-site .

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/static-site

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop static-site || true
            docker rm static-site || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/static-site
            docker run -d -p 80:80 --name static-site ${{ secrets.DOCKER_USERNAME }}/static-site
